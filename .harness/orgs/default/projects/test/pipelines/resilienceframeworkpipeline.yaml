pipeline:
  name: resilience-framework-pipeline
  identifier: resilienceframeworkpipeline
  projectIdentifier: test
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: testbuilddeploy
        identifier: testbuilddeploy
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.resiliencekube
              namespace: resilience-demo
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: GitClone
                  name: GitClone_1
                  identifier: GitClone_1
                  spec:
                    connectorRef: testgit
                    build:
                      type: branch
                      spec:
                        branch: main
              - step:
                  type: Run
                  name: Prepare Environment
                  identifier: Prepare_Environment
                  spec:
                    connectorRef: Docker_Hub_Connector
                    image: python:3.11
                    shell: Sh
                    command: |-
                      echo "Source Code Downloaded"

                      pwd
                      ls -la

                      python --version
              - step:
                  type: Run
                  name: Run_2
                  identifier: Run_2
                  spec:
                    connectorRef: Docker_Hub_Connector
                    image: python:3.11
                    shell: Sh
                    command: pip install -r requirements.txt
    - stage:
        name: Assessment
        identifier: Assessment
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Resilience Assessment
                  identifier: Resilience_Assessment
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          mkdir -p architecture
                          mkdir -p scripts

                          cat > architecture/application.yaml << 'EOF'
                          application:
                            name: sample-app

                          services:
                            - name: frontend
                              replicas: 2
                              healthCheck: true
                              resources: true

                            - name: backend
                              replicas: 2
                              healthCheck: true
                              resources: true

                            - name: database
                              replicas: 1
                              backupEnabled: true
                          EOF

                          cat architecture/application.yaml

                          cat > scripts/resilience_check.py <<'EOF'

                          # scripts/resilience_check.py

                          import yaml
                          import json

                          score = 100

                          with open("architecture/application.yaml") as f:
                              data = yaml.safe_load(f)

                          for service in data["services"]:

                              if service.get("replicas", 1) < 2:
                                  score -= 20

                              if not service.get("healthCheck", False):
                                  score -= 10

                              if not service.get("resources", False):
                                  score -= 10

                          result = {
                              "application": data["application"]["name"],
                              "score": score
                          }

                          with open("reports/result.json","w") as f:
                              json.dump(result,f)

                          print(result)

                          EOF
                          python scripts/resilience_check.py
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - step:
                  type: ShellScript
                  name: ShellScript_2
                  identifier: ShellScript_2
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          score=95

                          echo "Current Score: $score"

                          if [ $score -lt 90 ]; then
                              echo "Assessment Failed"
                              exit 1
                          fi

                          echo "Assessment Passed"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
    - stage:
        name: testdeploy
        identifier: testdeploy
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: testservice
          environment:
            environmentRef: testinfra
            deployToAll: false
            infrastructureDefinitions:
              - identifier: testinfranew
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: testpoddelet
        identifier: testpoddelet
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Chaos
                  name: Chaos_1
                  identifier: Chaos_1
                  spec:
                    experimentRef: 63d92c6a-8506-4568-b1e7-df89e97c4274
                    expectedResilienceScore: 50
        tags: {}
    - stage:
        name: metrics
        identifier: metrics
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: python assessment/metrics_collector.py
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
    - stage:
        name: Generate_score
        identifier: Generate_score
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: python assessment/resilience_score.py
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
    - stage:
        name: report generate
        identifier: report_generate
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: python assessment/report_generator.py
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
  properties:
    ci:
      codebase:
        connectorRef: testgit
        build: <+input>
