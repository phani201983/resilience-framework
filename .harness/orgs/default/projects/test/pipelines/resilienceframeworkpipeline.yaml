pipeline:
  name: resilience-framework-pipeline
  identifier: resilienceframeworkpipeline
  projectIdentifier: test
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: testbuild
        identifier: testbuild
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.resiliencekube
              namespace: resilience-demo
              serviceAccountName: harness-sa
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: GitClone
                  name: GitClone_1
                  identifier: GitClone_1
                  spec:
                    connectorRef: testgit
                    build:
                      type: branch
                      spec:
                        branch: main
              - step:
                  type: Run
                  name: Prepare Environment
                  identifier: Prepare_Environment
                  spec:
                    connectorRef: account.harnessImage
                    image: docker.io/library/python:3.11
                    shell: Sh
                    command: |-
                      echo "Source Code Downloaded"

                      pwd
                      ls -la

                      python --version
              - step:
                  type: Run
                  name: Run_2
                  identifier: Run_2
                  spec:
                    connectorRef: account.harnessImage
                    image: docker.io/library/python:3.11
                    shell: Sh
                    command: pip install -r requirements.txt
    - stage:
        name: Assessment
        identifier: Assessment
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Resilience Assessment
                  identifier: Resilience_Assessment
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          echo "Running Resilience Assessment"

                          score=95

                          echo "Score: $score"

                          if [ $score -lt 90 ]; then
                            echo "Assessment Failed"
                            exit 1
                          fi

                          echo "Assessment Passed"
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
              - step:
                  type: Http
                  name: Http_1
                  identifier: Http_1
                  spec:
                    url: http://sample-app.resilience-demo.svc.cluster.local:5000/health
                    method: GET
                    headers: []
                    inputVariables: []
                    outputVariables: []
                  timeout: 10s
        tags: {}
    - stage:
        name: testdeploy
        identifier: testdeploy
        description: ""
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: testservice
          environment:
            environmentRef: testinfra
            deployToAll: false
            infrastructureDefinitions:
              - identifier: testinfranew
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: testpoddelet
        identifier: testpoddelet
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: Chaos
                  name: Chaos_1
                  identifier: Chaos_1
                  spec:
                    experimentRef: 63d92c6a-8506-4568-b1e7-df89e97c4274
                    expectedResilienceScore: 50
        tags: {}
    - stage:
        name: metrics
        identifier: metrics
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: python assessment/metrics_collector.py
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
    - stage:
        name: Generate_score
        identifier: Generate_score
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: python assessment/resilience_score.py
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
    - stage:
        name: report generate
        identifier: report_generate
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: python assessment/report_generator.py
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
  properties:
    ci:
      codebase:
        connectorRef: testgit
        build: <+input>
